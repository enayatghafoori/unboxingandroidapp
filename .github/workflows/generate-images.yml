name: Generate artwork (Nano Banana)

# Run from the Actions tab. Needs a repository secret named GEMINI_API_KEY.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these ids/files, space separated (empty = everything missing)"
        required: false
        default: ""
      force:
        description: "Regenerate images that already exist"
        type: boolean
        default: false
      model:
        description: "Gemini image model"
        required: false
        default: "gemini-2.5-flash-image"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ inputs.model }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only $ONLY); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python3 tools/generate_images.py "${args[@]}"
      - name: Commit images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/images
          if git diff --cached --quiet; then echo "No new images"; exit 0; fi
          git commit -m "Generate artwork with Nano Banana"
          git push
